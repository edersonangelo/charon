services:
  charon:
    build:
      context: .
      args:
        VERSION: dev
    environment:
      CHARON_DATABASE_URL: postgres://charon:charon@postgres:5432/charon?sslmode=disable
      CHARON_ADDR: ":8080"
      CHARON_LOG_LEVEL: debug
    ports:
      - "${CHARON_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: charon
      POSTGRES_PASSWORD: charon
      POSTGRES_DB: charon
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charon -d charon"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
