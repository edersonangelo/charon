services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: charon
      POSTGRES_PASSWORD: charon
      POSTGRES_DB: charon
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charon -d charon"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
