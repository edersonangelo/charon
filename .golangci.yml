version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - noctx
    - contextcheck
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: error-strings
        - name: error-return
        - name: context-as-argument
        - name: indent-error-flow
    gosec:
      excludes:
        - G104

  exclusions:
    presets:
      - common-false-positives
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - errcheck
      # contextcheck follows the call into templ's generated renderers, which
      # do receive and pass the context.
      - path: internal/web/
        linters:
          - contextcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/edersonangelo/charon
